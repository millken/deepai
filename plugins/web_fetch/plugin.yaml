id: web-fetch
name: Web Fetch Tool
version: 1.0.0
description: Fetches web page content with support for static and dynamic pages
author: DeepAI Team
type: tool
runtime: go
main: web_fetch.so

tags:
  - web
  - scraping
  - utility

permissions:
  - resource: network:http
    action: allow
    description: Make HTTP requests to fetch web pages
  - resource: network:chromium
    action: allow
    description: Use headless browser for dynamic content

config_schema:
  type: object
  properties:
    default_backend:
      type: string
      enum: ["http", "chromedp"]
      default: "http"
      description: Default backend to use for fetching
    timeout:
      type: integer
      default: 30
      minimum: 1
      maximum: 120
      description: Request timeout in seconds
    max_content_length:
      type: integer
      default: 1000000
      minimum: 1000
      maximum: 10000000
      description: Maximum content length in bytes

config:
  default_backend: "http"
  timeout: 30
  max_content_length: 1000000