id: echo-tool
name: Echo Tool
version: 1.0.0
description: A simple echo tool that repeats messages
author: DeepAI Team
type: tool
runtime: go
main: echo.so

tags:
  - utility
  - example

permissions:
  - resource: fs:read
    action: allow
    description: Read files for echo content

config_schema:
  type: object
  properties:
    prefix:
      type: string
      description: Prefix to add to echoed messages
      default: "[ECHO] "
    max_length:
      type: integer
      description: Maximum message length
      default: 1000
      minimum: 1
      maximum: 10000

config:
  prefix: "[ECHO] "
  max_length: 1000
