name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}
          TARGETS="
            linux/amd64
            linux/arm64
            darwin/amd64
            darwin/arm64
            windows/amd64
            windows/arm64
          "
          for target in $TARGETS; do
            os=${target%/*}
            arch=${target#*/}
            output=dist/deepai-${VERSION}-${os}-${arch}
            [ "$os" = "windows" ] && output=${output}.exe
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/millken/deepai/pkg/commands.Version=${VERSION}" -o "$output" ./cmd/deepai
          done

      - name: Make tarballs
        run: |
          cd dist
          for f in deepai-*; do
            tar -czf "${f}.tar.gz" "$f"
            rm "$f"
          done

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
