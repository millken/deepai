id: eval-agents-cli-requirements
agent_type: product-manager
task: "为 `deepai eval agents` 命令编写需求规格，覆盖 --runs 重复次数、--filter 按 agent_type 或 tag 过滤、以及产出 summary 报告这三部分的验收标准"
tags: [go]
expect:
  - mentions: [runs, filter]
  - not_mentions: [SubagentRunner, ExecuteFork]
  - tool_calls_max: 15
  - no_writes: true
  - tokens_max: 50000
