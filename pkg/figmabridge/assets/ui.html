<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<style>
:root{color-scheme:light dark}
body{margin:0;padding:14px;font:12px/1.6 system-ui;color:var(--figma-color-text,#242424);background:var(--figma-color-bg,#fff)}
p{margin:0}
[role=status]{font-weight:600}
small{opacity:.75}
</style>
<p role="status">连接中…</p>
<small>保持本面板开启；任务执行进度在此显示</small>
<script>
// 会话配置由 bridge 生成时注入（port/token/binding）
const config = SESSION_CONFIG;
const status = document.querySelector('[role=status]');

// 长轮询挂起上限（桥侧 pollHold=20s）之上留余量，避免正常挂起被误判超时。
const POLL_TIMEOUT_MS = 35000;
const COMPLETE_TIMEOUT_MS = 60000;

async function request(route, body, timeoutMs) {
  const response = await fetch('http://localhost:' + config.port + route, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Session-Token': config.token },
    body: JSON.stringify(body),
    signal: AbortSignal.timeout(timeoutMs)
  });
  if (!response.ok) {
    const err = Error(route + ' ' + response.status);
    err.status = response.status;
    throw err;
  }
  return response.json();
}

const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const backoff = failures => Math.min(5000, 500 * 2 ** Math.min(failures, 4));

let online = false;
let authFailed = false;
let busy = false;
let busyJobId = '';
let pendingResult = null;

function render() {
  if (authFailed) status.textContent = '认证失败：请重新导入插件';
  else if (!online) status.textContent = '等待连接 deepai…';
  else if (pendingResult) status.textContent = '回传结果…';
  else if (busy) status.textContent = '执行中：' + busyJobId;
  else status.textContent = '已连接 deepai';
}

function finishJob() {
  pendingResult = null;
  busy = false;
  busyJobId = '';
}

// 桥以 400/413 拒收（图像无效 / 超 8MB）时原样重发只会无限失败：逐级瘦身为
// 失败结果，保证任务落到确定终态；连最小结果也被拒则放弃。
function shrink(result, httpStatus) {
  const executionStarted = !!(result.ok || result.executionStarted);
  if (!result.shrunk) {
    const error = '结果回传被桥拒收（HTTP ' + httpStatus + '）' +
      (result.ok ? '：脚本已执行，请缩小返回值或截图后核实现状' : '：' + (result.error || ''));
    return { type: 'result', id: result.id, ok: false, executionStarted, error,
      before: result.before, after: result.after, shrunk: 1 };
  }
  if (result.shrunk === 1)
    return { type: 'result', id: result.id, ok: false, executionStarted, error: result.error, shrunk: 2 };
  return null;
}

// 回传与轮询解耦：回传失败不再挡住轮询（此前 /complete 一旦持续失败，面板就
// 永久停在「等待连接」，只能重开插件）。
let flushing = false;
async function flushResult() {
  if (flushing) return;
  flushing = true;
  try {
    for (let failures = 0; pendingResult; ) {
      try {
        await request('/complete', pendingResult, COMPLETE_TIMEOUT_MS);
        finishJob();
      } catch (e) {
        if (e.status === 409) {
          // 桥已不认该任务（上次回传其实已落盘但响应丢失，或已被核实 ack）。
          finishJob();
        } else if (e.status === 400 || e.status === 413) {
          pendingResult = shrink(pendingResult, e.status);
          if (!pendingResult) finishJob();
        } else {
          authFailed = e.status === 403;
          render();
          await sleep(backoff(failures++));
        }
      }
      render();
    }
  } finally {
    flushing = false;
  }
}

// 长轮询循环：成功路径不经过定时器（后台节流只影响失败重试的退避），
// 有任务入队时桥立即返回。执行期以 heartbeat:true 持续挂起作心跳、不领取任务。
async function pollLoop() {
  for (let failures = 0; ; ) {
    try {
      // 未连上时先发不挂起的探测，连上即刻刷新面板状态。
      const job = await request('/poll', { client: 'deepai-plugin', heartbeat: busy, wait: online }, POLL_TIMEOUT_MS);
      online = true;
      authFailed = false;
      failures = 0;
      if (job) {
        busy = true;
        busyJobId = job.id || '';
        parent.postMessage({ pluginMessage: { type: 'job', ...job } }, '*');
      }
      render();
    } catch (e) {
      online = false;
      authFailed = e.status === 403;
      render();
      await sleep(backoff(failures++));
    }
  }
}

onmessage = event => {
  const msg = event.data && event.data.pluginMessage;
  if (msg && msg.type === 'result') {
    // Uint8Array 无法 JSON 序列化；分块转 base64（体积比数字数组小 4 倍）。
    // pngs 为多图通道（深检测提取的嵌套图像），单图 png 保留兼容。
    const toB64 = u8 => {
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < u8.length; i += chunk)
        binary += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
      return btoa(binary);
    };
    if (Array.isArray(msg.pngs)) {
      msg.pngsB64 = msg.pngs.map(toB64);
      delete msg.pngs;
    } else if (msg.png instanceof Uint8Array) {
      msg.pngB64 = toB64(msg.png);
      delete msg.png;
    }
    pendingResult = msg;
    render();
    void flushResult();
  }
};

void pollLoop();
</script>
</html>
