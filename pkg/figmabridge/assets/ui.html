<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<style>
:root{color-scheme:light dark}
body{margin:0;padding:14px;font:12px/1.6 system-ui;color:var(--figma-color-text,#242424);background:var(--figma-color-bg,#fff)}
p{margin:0}
[role=status]{font-weight:600}
small{opacity:.75}
</style>
<p role="status">连接中…</p>
<small>保持本面板开启；任务执行进度在此显示</small>
<script>
// 会话配置由 bridge 生成时注入（port/token/binding）
const config = SESSION_CONFIG;
const status = document.querySelector('[role=status]');

async function request(route, body) {
  const response = await fetch('http://localhost:' + config.port + route, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Session-Token': config.token },
    body: JSON.stringify(body),
    signal: AbortSignal.timeout(4000)
  });
  if (!response.ok) throw Error(route + ' ' + response.status);
  return response.json();
}

let busy = false;
let pendingResult = null;

let ticking = false;
async function tick() {
  if (ticking) return;
  ticking = true;
  try {
    if (pendingResult) {
      await request('/complete', pendingResult);
      pendingResult = null;
      busy = false;
    }
    // 执行期也持续轮询作心跳（heartbeat:true 只刷新连接新鲜度、不领取任务）：
    // 此前 busy 时停发 poll，超过 pollFreshSecs 的执行会让桥误判断连（超时误报 + 假死收割）。
    const job = await request('/poll', { client: 'deepai-plugin', heartbeat: busy });
    if (job) {
      busy = true;
      status.textContent = '执行中：' + (job.id || '');
      parent.postMessage({ pluginMessage: { type: 'job', ...job } }, '*');
    } else if (!busy) {
      status.textContent = '已连接 deepai';
    }
  } catch (e) {
    status.textContent = '等待连接 deepai…';
  } finally {
    ticking = false;
  }
}

onmessage = event => {
  const msg = event.data && event.data.pluginMessage;
  if (msg && msg.type === 'result') {
    // Uint8Array 无法 JSON 序列化；分块转 base64（体积比数字数组小 4 倍）。
    // pngs 为多图通道（深检测提取的嵌套图像），单图 png 保留兼容。
    const toB64 = u8 => {
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < u8.length; i += chunk)
        binary += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
      return btoa(binary);
    };
    if (Array.isArray(msg.pngs)) {
      msg.pngsB64 = msg.pngs.map(toB64);
      delete msg.pngs;
    } else if (msg.png instanceof Uint8Array) {
      msg.pngB64 = toB64(msg.png);
      delete msg.png;
    }
    pendingResult = msg;
    status.textContent = '回传结果…';
  }
};

setInterval(tick, 750);
tick();
</script>
</html>
